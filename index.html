<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>Signal Stories control</title>
<style>body{margin:0;background:#0b1020;color:#e8ecff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}a.b{display:block;margin-top:18px;background:#2563eb;color:#fff;padding:16px 22px;border-radius:12px;text-decoration:none;font-weight:700}.m{color:#8f9bc4;font-size:.85rem;margin-top:14px}code{color:#c7d2fe}</style></head>
<body><main><h2>Signal Stories control</h2><p id="s">Opening permanent cloud control…</p><div id="x"></div>
<p class="m">Permanent cloud control (Oracle Always Free). Laptop is not required.</p></main>
<script>
const FALLBACK="https://145.241.106.78.sslip.io/m/";
fetch("live.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  const url=(j && j.url) ? j.url : FALLBACK;
  document.getElementById("s").textContent="Cloud control address ready";
  const a=document.createElement("a");a.className="b";a.href=url;a.textContent="Open control app";
  document.getElementById("x").append(a);
  location.replace(url);
}).catch(()=>{
  document.getElementById("s").textContent="Using permanent cloud URL";
  const a=document.createElement("a");a.className="b";a.href=FALLBACK;a.textContent="Open control app";
  document.getElementById("x").append(a);
  location.replace(FALLBACK);
});
</script></body></html>
